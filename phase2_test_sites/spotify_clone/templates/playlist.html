{% extends "base.html" %}
{% block content %}
<div class="header-meta">
    <div class="header-art"></div>
    <div class="header-info">
        <span class="header-type">Playlist</span>
        <h1 class="header-title">{{ playlist.title }}</h1>
        <span class="header-stats">{{ playlist.description }} • {{ playlist.tracks|length }} songs</span>
    </div>
</div>
<div class="content-section">
    <table class="tracklist">
        <tr>
            <th class="track-num">#</th>
            <th>Title</th>
        </tr>
        {% for track in playlist.tracks %}
        <tr>
            <td class="track-num">{{ loop.index }}</td>
            <td>{{ track }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
